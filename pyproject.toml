[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wagent"
version = "0.1.0"
description = "桌面微信 GUI Agent：屏幕感知 + 层级记忆 + 拟人化回复"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "rapidocr-onnxruntime>=1.3",
    "openai>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Windows 专属依赖：截图（dxcam）、窗口（pywin32）、输入（pyautogui/pynput/pyperclip）
windows = [
    "dxcam>=0.0.5",
    "pywin32>=306",
    "pyautogui>=0.9.54",
    "pyperclip>=1.8.2",
    "pynput>=1.7.6",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml",
]

[project.scripts]
wagent = "wagent.main:main"
wagent-import = "wagent.import_chat:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 中文项目：全角标点是有意为之（RUF001/002/003 会误报）
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["wagent"]

[tool.mypy]
python_version = "3.11"
# 项目只跑 Windows；固定平台让 CI（Linux）上的 mypy 结果与本地一致
platform = "win32"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
